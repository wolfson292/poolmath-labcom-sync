<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pool Sync</title>
<style>
  /* No external assets: this runs on a LAN box that may have no internet route. */
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --ink: #1b2733;
    --muted: #64748b;
    --line: #dfe5ec;
    --accent: #255aab;
    --ok: #157347;
    --warn: #a15c07;
    --bad: #b02a37;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11161c;
      --card: #1a222b;
      --ink: #e7edf4;
      --muted: #93a4b8;
      --line: #2b3742;
      --accent: #6ea8fe;
      --ok: #4ade80;
      --warn: #fbbf24;
      --bad: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1.5rem 1rem 3rem;
    background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 60rem; margin: 0 auto; }
  header { display: flex; flex-wrap: wrap; gap: .75rem 1rem; align-items: baseline; margin-bottom: .5rem; }
  h1 { font-size: 1.4rem; margin: 0; letter-spacing: -.01em; }
  .badge {
    font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
    padding: .15rem .5rem; border-radius: 999px; border: 1px solid var(--line); color: var(--muted);
  }
  .badge.dry { color: var(--warn); border-color: currentColor; }
  .badge.live { color: var(--ok); border-color: currentColor; }
  .bar { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; margin: 1rem 0 1.25rem; }
  button {
    font: inherit; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff; border: 0;
    padding: .55rem 1.1rem; border-radius: .5rem;
  }
  button:disabled { opacity: .55; cursor: default; }
  #msg { color: var(--muted); font-size: .9rem; }
  #msg.bad { color: var(--bad); }
  #msg.ok { color: var(--ok); }
  .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: .75rem; padding: 1rem 1.1rem; }
  .card h2 { font-size: 1.05rem; margin: 0 0 .15rem; }
  .card h2 a { color: var(--accent); text-decoration: none; }
  .card h2 a:hover { text-decoration: underline; }
  .card h2 a::after { content: " \2197"; font-size: .8em; opacity: .7; }
  .when { color: var(--muted); font-size: .85rem; margin-bottom: .8rem; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: .3rem .9rem; margin: 0; }
  dt { color: var(--muted); font-size: .85rem; }
  dd { margin: 0; font-variant-numeric: tabular-nums; text-align: right; }
  .none { color: var(--muted); font-style: italic; font-size: .9rem; }
  footer { margin-top: 1.5rem; color: var(--muted); font-size: .85rem; }
  footer code { font-size: .95em; }
  .err { color: var(--bad); }
  .csi { display: flex; align-items: baseline; gap: .5rem; margin: 0 0 .8rem; font-variant-numeric: tabular-nums; }
  .csi b { font-size: 1.15rem; }
  .csi .ok { color: var(--ok); }
  .csi .off { color: var(--warn); }
  .csi small { color: var(--muted); }
  dd.low, dd.high { color: var(--warn); font-weight: 600; }
  dd small { display: block; color: var(--muted); font-size: .72rem; font-weight: 400; }
  h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 1rem 0 .4rem; }
  ul.recs { margin: 0; padding: 0; list-style: none; display: grid; gap: .55rem; }
  ul.recs li { font-size: .92rem; }
  ul.recs .what { font-weight: 600; font-variant-numeric: tabular-nums; }
  ul.recs .note { display: block; color: var(--muted); font-size: .8rem; }
  .balanced { color: var(--ok); font-size: .92rem; margin: 0; }
  ul.notes { margin: .6rem 0 0; padding-left: 1.1rem; color: var(--muted); font-size: .82rem; }
  details.section { margin-top: .9rem; border-top: 1px solid var(--line); padding-top: .6rem; }
  details.section > summary {
    cursor: pointer; list-style: none; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); font-weight: 600;
  }
  details.section > summary::before { content: "▸ "; }
  details.section[open] > summary::before { content: "▾ "; }
  details.section > :not(summary) { margin-top: .6rem; }
  ul.history { list-style: none; margin: 0; padding: 0; display: grid; gap: .45rem; font-size: .85rem; }
  ul.history li { display: grid; grid-template-columns: 1fr auto; gap: .1rem .5rem; }
  ul.history .meta { grid-column: 1; color: var(--muted); font-size: .78rem; }
  ul.history .vals { grid-column: 1; font-variant-numeric: tabular-nums; }
  ul.history button { grid-row: 1 / span 2; grid-column: 2; align-self: center; background: none; color: var(--bad);
    border: 1px solid var(--line); padding: .15rem .5rem; font-size: .75rem; font-weight: 500; }
  form.manual { display: grid; grid-template-columns: auto 1fr auto; gap: .4rem .5rem; align-items: center; }
  form.manual .wide { grid-column: 2 / -1; }
  form.manual label.check { grid-column: 1 / -1; display: flex; gap: .5rem; align-items: center; color: var(--ink); }
  form.manual label.check input { width: auto; }
  form.manual label { color: var(--muted); font-size: .85rem; }
  form.manual input, form.manual select {
    font: inherit; font-size: .92rem; width: 100%; min-width: 0;
    padding: .3rem .45rem; border: 1px solid var(--line); border-radius: .4rem;
    background: var(--bg); color: var(--ink);
  }
  form.manual .unit { color: var(--muted); font-size: .85rem; }
  form.manual button { grid-column: 1 / -1; padding: .4rem .9rem; font-size: .9rem; }
  form.manual .fmsg { grid-column: 1 / -1; font-size: .82rem; color: var(--muted); min-height: 1.1em; }
  form.manual .fmsg.bad { color: var(--bad); }
  form.manual .fmsg.ok { color: var(--ok); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Pool Sync</h1>
    <span class="badge" id="mode">…</span>
    <span class="badge" id="interval"></span>
  </header>

  <div class="bar">
    <button id="sync">Sync now</button>
    <span id="msg"></span>
  </div>

  <div class="grid" id="bodies"></div>

  <footer id="foot"></footer>
</main>

<script>
  const PARAMS = [
    ["fc", "FC", "ppm"], ["cc", "CC", "ppm"], ["ph", "pH", ""],
    ["ta", "TA", "ppm"], ["cya", "CYA", "ppm"], ["ch", "CH", "ppm"],
    ["salt", "Salt", "ppm"], ["bor", "Borate", "ppm"], ["tds", "TDS", "ppm"],
  ];

  const round = (n) => Math.round(n * 100) / 100;

  function ago(iso) {
    if (!iso) return "never";
    const secs = (Date.now() - new Date(iso).getTime()) / 1000;
    if (secs < 90) return "just now";
    const mins = Math.round(secs / 60);
    if (mins < 60) return mins + " min ago";
    const hours = Math.round(mins / 60);
    if (hours < 48) return hours + " hr ago";
    return Math.round(hours / 24) + " days ago";
  }

  // Typed-in values survive the 30-second refresh, which rebuilds every card.
  const drafts = {};

  const LABELS = Object.fromEntries(PARAMS.map(([key, label, unit]) => [key, [label, unit]]));

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  const signed = (n) => (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n).toFixed(2);

  function temp(celsius, units) {
    return units === 1
      ? round(celsius) + " °C"
      : Math.round((celsius * 9 / 5 + 32) * 10) / 10 + " °F";
  }

  // Where a value came from, shown when it isn't from the latest LabCOM test.
  function provenance(reading, latest) {
    if (!reading.at) return reading.source;
    const fromLatest = reading.source === "LabCOM" && latest && reading.at === latest.takenAt;
    if (fromLatest) return null;
    const date = new Date(reading.at);
    const sameYear = date.getFullYear() === new Date().getFullYear();
    return reading.source + " · " + date.toLocaleDateString(undefined,
      sameYear ? { month: "short", day: "numeric" } : { month: "short", year: "numeric" });
  }

  function readings(body) {
    const balance = body.balance;
    const water = balance ? balance.water : null;
    const status = Object.fromEntries((balance ? balance.targets : []).map((t) => [t.key, t.status]));
    const dl = el("dl");
    let shown = 0;

    for (const [key, label, unit] of PARAMS) {
      const reading = water ? water[key] : (body.latest && body.latest[key] != null
        ? { value: body.latest[key], source: "LabCOM", at: body.latest.takenAt } : null);
      if (!reading) continue;
      shown++;
      const dd = el("dd", status[key] === "low" || status[key] === "high" ? status[key] : "",
        unit ? round(reading.value) + " " + unit : String(round(reading.value)));
      const from = provenance(reading, body.latest);
      if (from) dd.appendChild(el("small", "", from));
      dl.append(el("dt", "", label), dd);
    }

    const t = water && water.waterTempC;
    if (t) {
      shown++;
      const dd = el("dd", "", temp(t.value, body.tempUnits));
      const from = provenance(t, body.latest);
      if (from) dd.appendChild(el("small", "", from));
      if (t.note) dd.appendChild(el("small", "", t.note));
      dl.append(el("dt", "", "Temp"), dd);
    }

    return shown ? dl : el("p", "none", "No readings yet.");
  }

  function balanceSection(body) {
    const frag = document.createDocumentFragment();
    const balance = body.balance;
    if (!balance) return frag;

    frag.appendChild(el("h3", "", "To reach Pool Math's ideal levels"));

    if (balance.recommendations.length === 0) {
      const unknown = balance.targets.filter((t) => t.status === "unknown").map((t) => t.label);
      frag.appendChild(unknown.length
        ? el("p", "none", "Nothing to add for the readings available. No reading yet for " + unknown.join(", ") + ".")
        : el("p", "balanced", "Nothing to add — everything is in range."));
    } else {
      const ul = el("ul", "recs");
      for (const r of balance.recommendations) {
        const li = el("li");
        const [, unit] = LABELS[r.key] || [r.label, ""];
        li.appendChild(el("span", "what",
          r.label + " " + round(r.current) + " → " + round(r.target) + (unit ? " " + unit : "")));
        li.appendChild(document.createTextNode(r.amount ? ": " + r.amount : ""));
        if (r.note) li.appendChild(el("span", "note", r.note));
        ul.appendChild(li);
      }
      frag.appendChild(ul);
    }

    if (balance.notes.length) {
      const ul = el("ul", "notes");
      for (const n of balance.notes) ul.appendChild(el("li", "", n));
      frag.appendChild(ul);
    }

    return frag;
  }

  function csiLine(balance) {
    const line = el("div", "csi");
    if (!balance || balance.csi === null || balance.csi === undefined) return null;
    const inRange = (v) => v >= balance.csiMin && v <= balance.csiMax;
    line.appendChild(el("span", "", "CSI"));
    line.appendChild(el("b", inRange(balance.csi) ? "ok" : "off", signed(balance.csi)));
    if (balance.csiAfter !== null && balance.csiAfter !== balance.csi) {
      line.appendChild(el("small", "", "→ " + signed(balance.csiAfter) + " after the changes below"));
    } else {
      line.appendChild(el("small", "", "ideal " + signed(balance.csiMin) + " to " + signed(balance.csiMax)));
    }
    return line;
  }

  // Remembers which collapsible sections are open, so the 30-second refresh doesn't close them.
  const openSections = new Set();

  function section(body, key, title, build) {
    const details = el("details", "section");
    const id = body.name + "|" + key;
    details.open = openSections.has(id);
    details.appendChild(el("summary", "", title));
    let built = false;
    const ensure = () => {
      if (built || !details.open) return;
      built = true;
      details.appendChild(build());
    };
    details.addEventListener("toggle", () => {
      details.open ? openSections.add(id) : openSections.delete(id);
      ensure();
    });
    ensure();
    return details;
  }

  function input(name, attrs) {
    const node = el("input");
    Object.assign(node, { name, inputMode: "decimal", placeholder: "—" }, attrs);
    return node;
  }

  // Saving a form: posts, shows the outcome under the form, refreshes the page on success.
  async function submit(form, message, button, url, method, payload) {
    button.disabled = true;
    message.className = "fmsg";
    message.textContent = "Saving…";
    try {
      const res = await fetch(url, {
        method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const result = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(result.error || res.status);
      return true;
    } catch (err) {
      message.className = "fmsg bad";
      message.textContent = "Not saved: " + err.message;
      button.disabled = false;
      return false;
    }
  }

  const TEST_FIELDS = [
    ["fc", "FC", "ppm", "0.1"], ["cc", "CC", "ppm", "0.1"], ["ph", "pH", "", "0.01"],
    ["ta", "TA", "ppm", "1"], ["cya", "CYA", "ppm", "1"], ["ch", "CH", "ppm", "10"],
    ["salt", "Salt", "ppm", "50"], ["bor", "Borate", "ppm", "1"],
  ];

  function testForm(body) {
    const draft = drafts[body.name] || (drafts[body.name] = {});
    const form = el("form", "manual");
    const inputs = {};

    for (const [key, label, unit, step] of TEST_FIELDS) {
      inputs[key] = input(key, { type: "number", step, min: "0" });
      form.append(el("label", "", label), inputs[key], el("span", "unit", unit));
    }

    inputs.waterTemp = input("waterTemp", { type: "number", step: "0.1" });
    const units = el("select");
    units.name = "units";
    units.append(new Option("°F", "0"), new Option("°C", "1"));
    form.append(el("label", "", "Water temp"), inputs.waterTemp, units);

    const when = input("when", { type: "datetime-local", inputMode: "text", placeholder: "" });
    when.className = "wide";
    form.append(el("label", "", "Taken"), when);
    const notes = input("notes", { type: "text", inputMode: "text", placeholder: "optional" });
    notes.className = "wide";
    form.append(el("label", "", "Notes"), notes);

    const all = [...Object.values(inputs), units, when, notes];
    for (const node of all) {
      node.value = draft[node.name] ?? "";
      node.addEventListener("input", () => { draft[node.name] = node.value; });
    }
    units.value = draft.units ?? String(body.tempUnits ?? 0);

    const save = el("button", "", "Save test");
    save.type = "submit";
    const fmsg = el("div", "fmsg", "Leave “Taken” empty for now. Fill in only what you measured.");
    form.append(save, fmsg);

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const payload = { waterBody: body.name, waterTempUnits: Number(units.value), notes: notes.value || null };
      for (const [key, node] of Object.entries(inputs)) {
        if (node.value !== "") payload[key] = Number(node.value);
      }
      if (when.value) payload.takenAt = new Date(when.value).toISOString();
      if (await submit(form, fmsg, save, "tests", "POST", payload)) {
        delete drafts[body.name];
        await refresh(true);
      }
    });

    return form;
  }

  function describeTest(t) {
    const parts = [];
    for (const [key, label, unit] of TEST_FIELDS) {
      if (t[key] !== null && t[key] !== undefined) parts.push(label + " " + round(t[key]));
    }
    if (t.waterTemp !== null && t.waterTemp !== undefined) {
      parts.push(round(t.waterTemp) + (t.waterTempUnits === 1 ? " °C" : " °F"));
    }
    return parts.join(" · ") || "—";
  }

  const SOURCE_NAMES = { labcom: "LabCOM", manual: "Manual", poolmath: "Pool Math" };

  function historySection(body) {
    const wrap = el("div");
    const list = el("ul", "history");
    wrap.appendChild(el("p", "none", "Loading…"));

    fetch("tests?waterBody=" + encodeURIComponent(body.name) + "&limit=30", { cache: "no-store" })
      .then((res) => res.json())
      .then((tests) => {
        wrap.replaceChildren(list);
        if (!tests.length) wrap.replaceChildren(el("p", "none", "No tests stored yet."));
        for (const t of tests) {
          const li = el("li");
          li.appendChild(el("span", "vals", describeTest(t)));
          li.appendChild(el("span", "meta",
            new Date(t.takenAt).toLocaleString() + " · " + (SOURCE_NAMES[t.source] || t.source) +
            (t.notes ? " · " + t.notes : "")));
          if (t.source === "manual") {
            const del = el("button", "", "Delete");
            del.type = "button";
            del.addEventListener("click", async () => {
              if (!confirm("Delete this test?")) return;
              del.disabled = true;
              const res = await fetch("tests/" + encodeURIComponent(t.id), { method: "DELETE" });
              if (res.ok) { li.remove(); refresh(true); } else { del.disabled = false; }
            });
            li.appendChild(del);
          }
          list.appendChild(li);
        }
      })
      .catch((err) => wrap.replaceChildren(el("p", "err", "Could not load history: " + err.message)));

    return wrap;
  }

  function settingsSection(body) {
    const s = body.settings || {};
    const form = el("form", "manual");
    const num = (name, step) => {
      const node = input(name, { type: "number", step, min: "0" });
      node.value = s[name] ?? "";
      return node;
    };
    const select = (name, options, value) => {
      const node = el("select");
      node.name = name;
      for (const [text, val] of options) node.append(new Option(text, val));
      node.value = String(value);
      return node;
    };

    const volume = num("volume", "100");
    const volumeUnit = select("volumeUnit", [["gal", "0"], ["L", "1"]], s.volumeUnit ?? 0);
    const surface = select("surface", [["Plaster", "Plaster"], ["Fiberglass", "Fiberglass"], ["Vinyl", "Vinyl"]],
      s.surface ?? "Plaster");
    surface.className = "wide";
    const tempUnits = select("tempUnits", [["°F", "0"], ["°C", "1"]], s.tempUnits ?? 0);
    tempUnits.className = "wide";
    const swg = el("input");
    swg.type = "checkbox";
    swg.checked = !!s.swg;
    const swgLabel = el("label", "check");
    swgLabel.append(swg, document.createTextNode("Salt water generator"));

    const fields = {
      saltMin: num("saltMin", "100"), saltTarget: num("saltTarget", "100"), saltMax: num("saltMax", "100"),
      borMin: num("borMin", "1"), borTarget: num("borTarget", "1"), borMax: num("borMax", "1"),
      fcTarget: num("fcTarget", "0.5"),
    };

    form.append(
      el("label", "", "Volume"), volume, volumeUnit,
      el("label", "", "Surface"), surface,
      el("label", "", "Temp unit"), tempUnits,
      swgLabel,
      el("label", "", "Salt min"), fields.saltMin, el("span", "unit", "ppm"),
      el("label", "", "Salt target"), fields.saltTarget, el("span", "unit", "ppm"),
      el("label", "", "Salt max"), fields.saltMax, el("span", "unit", "ppm"),
      el("label", "", "Borate min"), fields.borMin, el("span", "unit", "ppm"),
      el("label", "", "Borate target"), fields.borTarget, el("span", "unit", "ppm"),
      el("label", "", "Borate max"), fields.borMax, el("span", "unit", "ppm"),
      el("label", "", "FC target"), fields.fcTarget, el("span", "unit", "ppm"));

    const save = el("button", "", "Save settings");
    save.type = "submit";
    const fmsg = el("div", "fmsg", "Leave a target empty to skip that check. FC target empty = follow CYA.");
    form.append(save, fmsg);

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const value = (node) => (node.value === "" ? null : Number(node.value));
      const payload = {
        volume: value(volume), volumeUnit: Number(volumeUnit.value), surface: surface.value,
        swg: swg.checked, tempUnits: Number(tempUnits.value),
      };
      for (const [key, node] of Object.entries(fields)) payload[key] = value(node);
      if (await submit(form, fmsg, save, "settings/" + encodeURIComponent(body.name), "PUT", payload)) {
        await refresh(true);
      }
    });

    return form;
  }

  function card(body) {
    const card = el("div", "card");

    const title = el("h2");
    if (body.shareUrl) {
      // Only linked when Pool Math actually reports a share code, so there are no dead links.
      const a = el("a", "", body.name);
      a.href = body.shareUrl;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      title.appendChild(a);
    } else {
      title.textContent = body.name;
    }
    card.appendChild(title);

    const latest = body.latest;
    card.appendChild(el("div", "when", latest
      ? "Tested " + ago(latest.takenAt) + " · " + new Date(latest.takenAt).toLocaleString()
      : "No LabCOM readings yet"));

    const csi = csiLine(body.balance);
    if (csi) card.appendChild(csi);

    card.appendChild(readings(body));
    card.appendChild(balanceSection(body));

    card.appendChild(section(body, "add", "Add a test", () => testForm(body)));
    card.appendChild(section(body, "history", "History", () => historySection(body)));
    card.appendChild(section(body, "settings", "Pool settings", () => settingsSection(body)));

    return card;
  }

  async function refresh(force) {
    // Don't rebuild the cards out from under someone typing into one of them.
    const active = document.activeElement;
    if (!force && active && active.closest && active.closest("#bodies form")) return;

    let data;
    try {
      const res = await fetch("status", { cache: "no-store" });
      if (!res.ok) throw new Error("status returned " + res.status);
      data = await res.json();
    } catch (err) {
      document.getElementById("foot").innerHTML =
        '<span class="err">Could not load status: ' + err.message + "</span>";
      return;
    }

    const mode = document.getElementById("mode");
    mode.textContent = data.dryRun ? "Dry run" : "Live";
    mode.className = "badge " + (data.dryRun ? "dry" : "live");
    document.getElementById("interval").textContent = "every " + data.interval;

    const grid = document.getElementById("bodies");
    grid.replaceChildren(...(data.waterBodies || []).map(card));

    const parts = ["Last sync " + ago(data.lastSuccessAt)];
    if (data.lastError) {
      parts.push('<span class="err">Last error ' + ago(data.lastErrorAt) + ": " +
        data.lastError.replace(/[<>&]/g, "") + "</span>");
    }
    if (data.consecutiveFailures > 0) {
      parts.push(data.consecutiveFailures + " consecutive failure(s)");
    }
    const stored = data.stored || {};
    const tests = Object.entries(stored).filter(([k]) => k.startsWith("tests:")).reduce((n, [, v]) => n + v, 0);
    parts.push(tests + " tests stored");
    if (data.poolMath) {
      parts.push(!data.poolMath.enabled ? "Pool Math off"
        : data.poolMath.writeLogs ? "copying tests to Pool Math" : "not writing to Pool Math");
    }

    const foot = document.getElementById("foot");
    foot.innerHTML = parts.join(" · ");

    if (data.poolMath && data.poolMath.enabled) {
      const importButton = el("button", "", stored["tests:poolmath"] ? "Re-import Pool Math history" : "Import Pool Math history");
      importButton.style.cssText = "margin-left:.75rem;padding:.25rem .7rem;font-size:.8rem";
      importButton.addEventListener("click", async () => {
        importButton.disabled = true;
        importButton.textContent = "Importing…";
        try {
          const res = await fetch("import/poolmath", { method: "POST" });
          const r = await res.json();
          if (!res.ok) throw new Error(r.error || res.status);
          msg.className = "ok";
          msg.textContent = "Imported " + r.tests + " test(s), " + r.additions + " addition(s), " +
            r.maintenance + " maintenance entr(ies); " + r.alreadyImported + " already here.";
        } catch (err) {
          msg.className = "bad";
          msg.textContent = "Import failed: " + err.message;
        }
        refresh(true);
      });
      foot.appendChild(importButton);
    }
  }

  const button = document.getElementById("sync");
  const msg = document.getElementById("msg");

  button.addEventListener("click", async () => {
    button.disabled = true;
    msg.className = "";
    msg.textContent = "Syncing…";

    try {
      const res = await fetch("sync", { method: "POST" });
      const body = await res.json().catch(() => ({}));

      if (res.status === 409) {
        msg.textContent = "A sync is already running.";
      } else if (!res.ok) {
        msg.className = "bad";
        msg.textContent = "Sync failed: " + (body.error || res.status);
      } else {
        msg.className = "ok";
        msg.textContent = body.logsWritten
          ? "Wrote " + body.logsWritten + " test log(s)."
          : "Up to date — nothing new to write.";
      }
    } catch (err) {
      msg.className = "bad";
      msg.textContent = "Sync failed: " + err.message;
    } finally {
      button.disabled = false;
      refresh();
    }
  });

  refresh();
  setInterval(refresh, 30000);
</script>
</body>
</html>
