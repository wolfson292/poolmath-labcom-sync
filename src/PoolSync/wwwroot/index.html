<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pool Sync</title>
<style>
  /* No external assets: this runs on a LAN box that may have no internet route. */
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --ink: #1b2733;
    --muted: #64748b;
    --line: #dfe5ec;
    --accent: #255aab;
    --ok: #157347;
    --warn: #a15c07;
    --bad: #b02a37;
    --series: #255aab;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11161c;
      --card: #1a222b;
      --ink: #e7edf4;
      --muted: #93a4b8;
      --line: #2b3742;
      --accent: #6ea8fe;
      --ok: #4ade80;
      --warn: #fbbf24;
      --bad: #f87171;
      --series: #5b95ec;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1.5rem 1rem 3rem;
    background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 60rem; margin: 0 auto; }
  header { display: flex; flex-wrap: wrap; gap: .75rem 1rem; align-items: baseline; margin-bottom: .5rem; }
  h1 { font-size: 1.4rem; margin: 0; letter-spacing: -.01em; }
  .badge {
    font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
    padding: .15rem .5rem; border-radius: 999px; border: 1px solid var(--line); color: var(--muted);
  }
  .badge.dry { color: var(--warn); border-color: currentColor; }
  .badge.live { color: var(--ok); border-color: currentColor; }
  .bar { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; margin: 1rem 0 1.25rem; }
  button {
    font: inherit; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff; border: 0;
    padding: .55rem 1.1rem; border-radius: .5rem;
  }
  button:disabled { opacity: .55; cursor: default; }
  #msg { color: var(--muted); font-size: .9rem; }
  #msg.bad { color: var(--bad); }
  #msg.ok { color: var(--ok); }
  nav.tabs { display: flex; gap: .25rem; border-bottom: 1px solid var(--line); margin-bottom: 1rem; overflow-x: auto; }
  nav.tabs button {
    background: none; color: var(--muted); border: 0; border-bottom: 2px solid transparent; border-radius: 0;
    padding: .55rem .9rem; font-weight: 600; white-space: nowrap; display: flex; gap: .4rem; align-items: center;
  }
  nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  nav.tabs .count { font-size: .7rem; color: var(--warn); border: 1px solid currentColor; border-radius: 999px;
    padding: 0 .35rem; line-height: 1.4; }
  #bodies .card { max-width: 44rem; margin: 0 auto; }
  .analysis { font-size: .9rem; line-height: 1.55; }
  .analysis h4 { font-size: .95rem; margin: .9rem 0 .3rem; }
  .analysis h4:first-child { margin-top: 0; }
  .analysis ul, .analysis ol { margin: .3rem 0 .6rem; padding-left: 1.2rem; }
  .analysis li { margin: .15rem 0; }
  .analysis p { margin: .4rem 0; }
  .analysis code { font-size: .85em; }
  .analysis table { border-collapse: collapse; margin: .4rem 0 .7rem; font-size: .85rem; }
  .analysis th, .analysis td { border-bottom: 1px solid var(--line); padding: .25rem .6rem .25rem 0; text-align: left; }
  .ai-bar { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; margin-bottom: .6rem; }
  .ai-bar button { padding: .4rem .9rem; font-size: .88rem; }
  .ai-bar span { color: var(--muted); font-size: .8rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: .75rem; padding: 1rem 1.1rem; }
  .card h2 { font-size: 1.05rem; margin: 0 0 .15rem; }
  .card h2 a { color: var(--accent); text-decoration: none; }
  .card h2 a:hover { text-decoration: underline; }
  .card h2 a::after { content: " \2197"; font-size: .8em; opacity: .7; }
  .when { color: var(--muted); font-size: .85rem; margin-bottom: .8rem; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: .3rem .9rem; margin: 0; }
  dt { color: var(--muted); font-size: .85rem; }
  dd { margin: 0; font-variant-numeric: tabular-nums; text-align: right; }
  .none { color: var(--muted); font-style: italic; font-size: .9rem; }
  footer { margin-top: 1.5rem; color: var(--muted); font-size: .85rem; }
  footer code { font-size: .95em; }
  .err { color: var(--bad); }
  .csi { display: flex; align-items: baseline; gap: .5rem; margin: 0 0 .8rem; font-variant-numeric: tabular-nums; }
  .csi b { font-size: 1.15rem; }
  .csi .ok { color: var(--ok); }
  .csi .off { color: var(--warn); }
  .csi small { color: var(--muted); }
  dd.low, dd.high { color: var(--warn); font-weight: 600; }
  dd small { display: block; color: var(--muted); font-size: .72rem; font-weight: 400; }
  h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 1rem 0 .4rem; }
  ul.recs { margin: 0; padding: 0; list-style: none; display: grid; gap: .55rem; }
  ul.recs li { font-size: .92rem; }
  ul.recs .what { font-weight: 600; font-variant-numeric: tabular-nums; }
  ul.recs .note { display: block; color: var(--muted); font-size: .8rem; }
  .balanced { color: var(--ok); font-size: .92rem; margin: 0; }
  ul.notes { margin: .6rem 0 0; padding-left: 1.1rem; color: var(--muted); font-size: .82rem; }
  details.section { margin-top: .9rem; border-top: 1px solid var(--line); padding-top: .6rem; }
  details.section > summary {
    cursor: pointer; list-style: none; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); font-weight: 600;
  }
  details.section > summary::before { content: "▸ "; }
  details.section[open] > summary::before { content: "▾ "; }
  details.section > :not(summary) { margin-top: .6rem; }
  ul.history { list-style: none; margin: 0; padding: 0; display: grid; gap: .45rem; font-size: .85rem; }
  ul.history li { display: grid; grid-template-columns: 1fr auto; gap: .1rem .5rem; }
  ul.history .meta { grid-column: 1; color: var(--muted); font-size: .78rem; }
  ul.history .vals { grid-column: 1; font-variant-numeric: tabular-nums; }
  ul.history button { grid-row: 1 / span 2; grid-column: 2; align-self: center; background: none; color: var(--bad);
    border: 1px solid var(--line); padding: .15rem .5rem; font-size: .75rem; font-weight: 500; }
  ul.alerts { list-style: none; margin: 0 0 .8rem; padding: .5rem .7rem; border-radius: .5rem;
    background: color-mix(in srgb, var(--warn) 12%, transparent); display: grid; gap: .3rem; font-size: .85rem; }
  ul.alerts li::before { content: "⚠ "; color: var(--warn); }
  .ctrl { font-size: .85rem; display: grid; grid-template-columns: auto 1fr; gap: .2rem .8rem; }
  .ctrl dt { font-size: .8rem; }
  .ctrl dd { text-align: right; }
  .ctrl dd.drift { color: var(--warn); font-weight: 600; }
  .preview { grid-column: 1 / -1; font-size: .85rem; font-variant-numeric: tabular-nums; min-height: 1.2em; }
  .due { font-size: .85rem; display: grid; gap: .2rem; margin: 0 0 .6rem; }
  .due .over { color: var(--warn); font-weight: 600; }
  .ranges { display: flex; gap: .35rem; margin-bottom: .6rem; }
  .ranges button { background: none; color: var(--muted); border: 1px solid var(--line); padding: .15rem .6rem;
    font-size: .78rem; font-weight: 500; }
  .ranges button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
  .chart { position: relative; margin-bottom: .9rem; }
  .chart .ctitle { font-size: .82rem; display: flex; justify-content: space-between; gap: .5rem; }
  .chart .ctitle span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart .axis { fill: var(--muted); font-size: 9px; font-variant-numeric: tabular-nums; }
  .chart .grid { stroke: var(--line); stroke-width: 1; }
  .chart .band { fill: var(--muted); opacity: .12; }
  .chart .line { fill: none; stroke: var(--series); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .dot { fill: var(--series); stroke: var(--card); stroke-width: 2; }
  .chart .cross { stroke: var(--muted); stroke-width: 1; }
  .chart .tip { position: absolute; pointer-events: none; background: var(--card); border: 1px solid var(--line);
    border-radius: .35rem; padding: .2rem .45rem; font-size: .75rem; white-space: nowrap; display: none;
    box-shadow: 0 2px 6px rgb(0 0 0 / .12); }
  form.manual { display: grid; grid-template-columns: auto 1fr auto; gap: .4rem .5rem; align-items: center; }
  form.manual .wide { grid-column: 2 / -1; }
  form.manual label.check { grid-column: 1 / -1; display: flex; gap: .5rem; align-items: center; color: var(--ink); }
  form.manual label.check input { width: auto; }
  form.manual label { color: var(--muted); font-size: .85rem; }
  form.manual input, form.manual select {
    font: inherit; font-size: .92rem; width: 100%; min-width: 0;
    padding: .3rem .45rem; border: 1px solid var(--line); border-radius: .4rem;
    background: var(--bg); color: var(--ink);
  }
  form.manual .unit { color: var(--muted); font-size: .85rem; }
  form.manual button { grid-column: 1 / -1; padding: .4rem .9rem; font-size: .9rem; }
  form.manual .fmsg { grid-column: 1 / -1; font-size: .82rem; color: var(--muted); min-height: 1.1em; }
  form.manual .fmsg.bad { color: var(--bad); }
  form.manual .fmsg.ok { color: var(--ok); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Pool Sync</h1>
    <span class="badge" id="mode">…</span>
    <span class="badge" id="interval"></span>
  </header>

  <div class="bar">
    <button id="sync">Sync now</button>
    <span id="msg"></span>
  </div>

  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div id="bodies"></div>

  <footer id="foot"></footer>
</main>

<script>
  const PARAMS = [
    ["fc", "FC", "ppm"], ["cc", "CC", "ppm"], ["ph", "pH", ""],
    ["ta", "TA", "ppm"], ["cya", "CYA", "ppm"], ["ch", "CH", "ppm"],
    ["salt", "Salt", "ppm"], ["bor", "Borate", "ppm"], ["tds", "TDS", "ppm"],
  ];

  const round = (n) => Math.round(n * 100) / 100;

  function ago(iso) {
    if (!iso) return "never";
    const secs = (Date.now() - new Date(iso).getTime()) / 1000;
    if (secs < 90) return "just now";
    const mins = Math.round(secs / 60);
    if (mins < 60) return mins + " min ago";
    const hours = Math.round(mins / 60);
    if (hours < 48) return hours + " hr ago";
    return Math.round(hours / 24) + " days ago";
  }

  // Typed-in values survive the 30-second refresh, which rebuilds every card.
  const drafts = {};

  const LABELS = Object.fromEntries(PARAMS.map(([key, label, unit]) => [key, [label, unit]]));

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  const signed = (n) => (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n).toFixed(2);

  function temp(celsius, units) {
    return units === 1
      ? round(celsius) + " °C"
      : Math.round((celsius * 9 / 5 + 32) * 10) / 10 + " °F";
  }

  // Where a value came from, shown when it isn't from the latest LabCOM test.
  function provenance(reading, latest) {
    if (!reading.at) return reading.source;
    const fromLatest = reading.source === "LabCOM" && latest && reading.at === latest.takenAt;
    if (fromLatest) return null;
    const date = new Date(reading.at);
    const sameYear = date.getFullYear() === new Date().getFullYear();
    return reading.source + " · " + date.toLocaleDateString(undefined,
      sameYear ? { month: "short", day: "numeric" } : { month: "short", year: "numeric" });
  }

  function readings(body) {
    const balance = body.balance;
    const water = balance ? balance.water : null;
    const status = Object.fromEntries((balance ? balance.targets : []).map((t) => [t.key, t.status]));
    const dl = el("dl");
    let shown = 0;

    for (const [key, label, unit] of PARAMS) {
      const reading = water ? water[key] : (body.latest && body.latest[key] != null
        ? { value: body.latest[key], source: "LabCOM", at: body.latest.takenAt } : null);
      if (!reading) continue;
      shown++;
      const dd = el("dd", status[key] === "low" || status[key] === "high" ? status[key] : "",
        unit ? round(reading.value) + " " + unit : String(round(reading.value)));
      const from = provenance(reading, body.latest);
      if (from) dd.appendChild(el("small", "", from));
      const diluted = body.dilution && body.dilution.readings.find((d) => d.key === key && d.percent >= 1);
      if (diluted) {
        const note = el("small", "", "≈ " + round(diluted.estimate) + " after rain since (−" + diluted.percent + "%)");
        note.title = diluted.rainInches + " in of rain since the test, of which about " + diluted.overflowInches +
          " in overflowed after evaporation. An estimate: retest to confirm.";
        dd.appendChild(note);
      }
      dl.append(el("dt", "", label), dd);
    }

    const t = water && water.waterTempC;
    if (t) {
      shown++;
      const dd = el("dd", "", temp(t.value, body.tempUnits));
      const from = provenance(t, body.latest);
      if (from) dd.appendChild(el("small", "", from));
      if (t.note) dd.appendChild(el("small", "", t.note));
      dl.append(el("dt", "", "Temp"), dd);
    }

    return shown ? dl : el("p", "none", "No readings yet.");
  }

  function balanceSection(body) {
    const frag = document.createDocumentFragment();
    const balance = body.balance;
    if (!balance) return frag;

    frag.appendChild(el("h3", "", "To reach ideal levels (TFP)"));

    if (balance.recommendations.length === 0) {
      const unknown = balance.targets.filter((t) => t.status === "unknown").map((t) => t.label);
      frag.appendChild(unknown.length
        ? el("p", "none", "Nothing to add for the readings available. No reading yet for " + unknown.join(", ") + ".")
        : el("p", "balanced", "Nothing to add — everything is in range."));
    } else {
      const ul = el("ul", "recs");
      for (const r of balance.recommendations) {
        const li = el("li");
        const [, unit] = LABELS[r.key] || [r.label, ""];
        li.appendChild(el("span", "what",
          r.label + " " + round(r.current) + " → " + round(r.target) + (unit ? " " + unit : "")));
        li.appendChild(document.createTextNode(r.amount ? ": " + r.amount : ""));
        if (r.note) li.appendChild(el("span", "note", r.note));
        ul.appendChild(li);
      }
      frag.appendChild(ul);
    }

    if (balance.notes.length) {
      const ul = el("ul", "notes");
      for (const n of balance.notes) ul.appendChild(el("li", "", n));
      frag.appendChild(ul);
    }

    return frag;
  }

  function csiLine(balance) {
    const line = el("div", "csi");
    if (!balance || balance.csi === null || balance.csi === undefined) return null;
    const inRange = (v) => v >= balance.csiMin && v <= balance.csiMax;
    line.appendChild(el("span", "", "CSI"));
    line.appendChild(el("b", inRange(balance.csi) ? "ok" : "off", signed(balance.csi)));
    if (balance.csiAfter !== null && balance.csiAfter !== balance.csi) {
      line.appendChild(el("small", "", "→ " + signed(balance.csiAfter) + " after the changes below"));
    } else {
      line.appendChild(el("small", "", "ideal " + signed(balance.csiMin) + " to " + signed(balance.csiMax)));
    }
    return line;
  }

  // Remembers which collapsible sections are open, so the 30-second refresh doesn't close them.
  const openSections = new Set();

  function section(body, key, title, build) {
    const details = el("details", "section");
    const id = body.name + "|" + key;
    details.open = openSections.has(id);
    details.appendChild(el("summary", "", title));
    let built = false;
    const ensure = () => {
      if (built || !details.open) return;
      built = true;
      details.appendChild(build());
    };
    details.addEventListener("toggle", () => {
      details.open ? openSections.add(id) : openSections.delete(id);
      ensure();
    });
    ensure();
    return details;
  }

  function input(name, attrs) {
    const node = el("input");
    Object.assign(node, { name, inputMode: "decimal", placeholder: "—" }, attrs);
    return node;
  }

  // Saving a form: posts, shows the outcome under the form, refreshes the page on success.
  async function submit(form, message, button, url, method, payload) {
    button.disabled = true;
    message.className = "fmsg";
    message.textContent = "Saving…";
    try {
      const res = await fetch(url, {
        method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const result = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(result.error || res.status);
      return true;
    } catch (err) {
      message.className = "fmsg bad";
      message.textContent = "Not saved: " + err.message;
      button.disabled = false;
      return false;
    }
  }

  const TEST_FIELDS = [
    ["fc", "FC", "ppm", "0.1"], ["cc", "CC", "ppm", "0.1"], ["ph", "pH", "", "0.01"],
    ["ta", "TA", "ppm", "1"], ["cya", "CYA", "ppm", "1"], ["ch", "CH", "ppm", "10"],
    ["salt", "Salt", "ppm", "50"], ["bor", "Borate", "ppm", "1"],
  ];

  function testForm(body) {
    const draft = drafts[body.name] || (drafts[body.name] = {});
    const form = el("form", "manual");
    const inputs = {};

    for (const [key, label, unit, step] of TEST_FIELDS) {
      inputs[key] = input(key, { type: "number", step, min: "0" });
      form.append(el("label", "", label), inputs[key], el("span", "unit", unit));
    }

    inputs.waterTemp = input("waterTemp", { type: "number", step: "0.1" });
    const units = el("select");
    units.name = "units";
    units.append(new Option("°F", "0"), new Option("°C", "1"));
    form.append(el("label", "", "Water temp"), inputs.waterTemp, units);

    const when = input("when", { type: "datetime-local", inputMode: "text", placeholder: "" });
    when.className = "wide";
    form.append(el("label", "", "Taken"), when);
    const notes = input("notes", { type: "text", inputMode: "text", placeholder: "optional" });
    notes.className = "wide";
    form.append(el("label", "", "Notes"), notes);

    const all = [...Object.values(inputs), units, when, notes];
    for (const node of all) {
      node.value = draft[node.name] ?? "";
      node.addEventListener("input", () => { draft[node.name] = node.value; });
    }
    units.value = draft.units ?? String(body.tempUnits ?? 0);

    const save = el("button", "", "Save test");
    save.type = "submit";
    const fmsg = el("div", "fmsg", "Leave “Taken” empty for now. Fill in only what you measured.");
    form.append(save, fmsg);

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const payload = { waterBody: body.name, waterTempUnits: Number(units.value), notes: notes.value || null };
      for (const [key, node] of Object.entries(inputs)) {
        if (node.value !== "") payload[key] = Number(node.value);
      }
      if (when.value) payload.takenAt = new Date(when.value).toISOString();
      if (await submit(form, fmsg, save, "tests", "POST", payload)) {
        delete drafts[body.name];
        await refresh(true);
      }
    });

    return form;
  }

  function describeTest(t) {
    const parts = [];
    for (const [key, label, unit] of TEST_FIELDS) {
      if (t[key] !== null && t[key] !== undefined) parts.push(label + " " + round(t[key]));
    }
    if (t.waterTemp !== null && t.waterTemp !== undefined) {
      parts.push(round(t.waterTemp) + (t.waterTempUnits === 1 ? " °C" : " °F"));
    }
    return parts.join(" · ") || "—";
  }

  const SOURCE_NAMES = { labcom: "LabCOM", manual: "Manual", poolmath: "Pool Math" };

  function historySection(body) {
    const wrap = el("div");
    const list = el("ul", "history");
    wrap.appendChild(el("p", "none", "Loading…"));

    fetch("tests?waterBody=" + encodeURIComponent(body.name) + "&limit=30", { cache: "no-store" })
      .then((res) => res.json())
      .then((tests) => {
        wrap.replaceChildren(list);
        if (!tests.length) wrap.replaceChildren(el("p", "none", "No tests stored yet."));
        for (const t of tests) {
          const li = el("li");
          li.appendChild(el("span", "vals", describeTest(t)));
          li.appendChild(el("span", "meta",
            new Date(t.takenAt).toLocaleString() + " · " + (SOURCE_NAMES[t.source] || t.source) +
            (t.notes ? " · " + t.notes : "")));
          if (t.source === "manual") {
            const del = el("button", "", "Delete");
            del.type = "button";
            del.addEventListener("click", async () => {
              if (!confirm("Delete this test?")) return;
              del.disabled = true;
              const res = await fetch("tests/" + encodeURIComponent(t.id), { method: "DELETE" });
              if (res.ok) { li.remove(); refresh(true); } else { del.disabled = false; }
            });
            li.appendChild(del);
          }
          list.appendChild(li);
        }
      })
      .catch((err) => wrap.replaceChildren(el("p", "err", "Could not load history: " + err.message)));

    return wrap;
  }

  function settingsSection(body) {
    const s = body.settings || {};
    const form = el("form", "manual");
    const num = (name, step) => {
      const node = input(name, { type: "number", step, min: "0" });
      node.value = s[name] ?? "";
      return node;
    };
    const select = (name, options, value) => {
      const node = el("select");
      node.name = name;
      for (const [text, val] of options) node.append(new Option(text, val));
      node.value = String(value);
      return node;
    };

    const volume = num("volume", "100");
    const volumeUnit = select("volumeUnit", [["gal", "0"], ["L", "1"]], s.volumeUnit ?? 0);
    const surface = select("surface", [["Plaster", "Plaster"], ["Fiberglass", "Fiberglass"], ["Vinyl", "Vinyl"], ["Spa (hot tub)", "Spa"]],
      s.surface ?? "Plaster");
    surface.className = "wide";
    const tempUnits = select("tempUnits", [["°F", "0"], ["°C", "1"]], s.tempUnits ?? 0);
    tempUnits.className = "wide";
    const swg = el("input");
    swg.type = "checkbox";
    swg.checked = !!s.swg;

    const fields = {

      borMin: num("borMin", "1"), borTarget: num("borTarget", "1"), borMax: num("borMax", "1"),
      fcTarget: num("fcTarget", "0.5"),
      latitude: num("latitude", "0.0001"),
      longitude: num("longitude", "0.0001"),
      surfaceArea: num("surfaceArea", "10"),
      acidTankLowOz: num("acidTankLowOz", "8"),
      filterPsiRise: num("filterPsiRise", "1"),
      phDriftLimit: num("phDriftLimit", "0.05"),

    const reminderInputs = {};
    for (const [task, label] of Object.entries(TASKS)) {
      const node = input("r_" + task, { type: "number", step: "1", min: "1" });

    }

    form.append(
      el("label", "", "Volume"), volume, volumeUnit,

      el("label", "", "Salt target"), fields.saltTarget, el("span", "unit", "ppm"),
      el("label", "", "Salt max"), fields.saltMax, el("span", "unit", "ppm"),
      el("label", "", "Borate min"), fields.borMin, el("span", "unit", "ppm"),
      el("label", "", "Borate target"), fields.borTarget, el("span", "unit", "ppm"),
      el("label", "", "Borate max"), fields.borMax, el("span", "unit", "ppm"),

    fields.latitude.min = "-90";
    form.append(

      el("label", "", "Acid tank low"), fields.acidTankLowOz, el("span", "unit", "fl oz"),

    form.addEventListener("submit", async (event) => {

  const TASKS = { backwashed: "Backwash", brushed: "Brush", vacuumed: "Vacuum", cleanedFilter: "Clean filter",
    cleanedCell: "Clean salt cell" };

  // The product list and units, loaded once.
  let catalog = null;
  const catalogReady = fetch("chemicals").then((r) => r.json()).then((c) => { catalog = c; });

  const short = (iso) => {
    const d = new Date(iso);
    return d.toLocaleDateString(undefined, d.getFullYear() === new Date().getFullYear()
      ? { month: "short", day: "numeric" } : { month: "short", day: "numeric", year: "numeric" });
  };

  function alertsBlock(body) {
    const items = [];
    const c = body.controller;
    if (c) {
      for (const issue of c.issues || []) if (issue.severity === "warning") items.push(issue.message);
      if (c.error) items.push("Controller: " + c.error);
    }
    for (const r of body.reminders || []) {
      if (r.overdue) items.push(r.label + " is due (last done " + short(r.lastDone) + ").");
    }
    if (!items.length) return null;
    const ul = el("ul", "alerts");
    // Messages start with the pool name, which the card already shows.
    for (const text of items) ul.appendChild(el("li", "", text.replace(body.name + ": ", "")));

  const ROLE_LABELS = {
    ph: "pH probe", orp: "ORP", waterTemp: "Water temp", salt: "Salt cell salt", filterPsi: "Filter pressure",
    pumpRpm: "Pump speed", pumpWatts: "Pump power", swgPercent: "Salt cell output",
    acidDosedToday: "Acid dosed today", acidTank: "Acid tank",
  };

  function sensorText(r, tempUnits) {
    switch (r.role) {
      case "ph": return r.value.toFixed(2);
      case "orp": return Math.round(r.value) + " mV";
      case "waterTemp": return temp(r.value, tempUnits);
      case "salt": return Math.round(r.value) + " ppm";
      case "filterPsi": return r.value.toFixed(1) + " psi";
      case "pumpRpm": return Math.round(r.value) + " rpm";
      case "pumpWatts": return Math.round(r.value) + " W";
      case "swgPercent": return Math.round(r.value) + "%";
      case "acidDosedToday": return round(r.value) + " fl oz";
      case "acidTank": return Math.round(r.value) + " fl oz";
      default: return String(round(r.value));
    }
  }

  function deltaText(c, tempUnits) {
    if (c.role === "waterTemp") {
      const d = tempUnits === 1 ? c.delta : c.delta * 9 / 5;
      return (d >= 0 ? "+" : "−") + Math.abs(d).toFixed(1) + (tempUnits === 1 ? " °C" : " °F");
    }
    const digits = c.role === "ph" ? 2 : 0;
    return (c.delta >= 0 ? "+" : "−") + Math.abs(c.delta).toFixed(digits) + (c.role === "salt" ? " ppm" : "");
  }

  function controllerSection(body) {
    const c = body.controller;
    const wrap = el("div");
    if (!c.connected) {
      wrap.appendChild(el("p", "none", c.error || "Not connected."));
      return wrap;
    }
    const dl = el("dl", "ctrl");
    for (const r of c.readings) {
      const dd = el("dd", "", sensorText(r, body.tempUnits));
      if (r.role === "filterPsi" && c.filterCleanPsi) dd.appendChild(el("small", "", "clean " + c.filterCleanPsi.toFixed(1) + " psi"));
      dl.append(el("dt", "", ROLE_LABELS[r.role] || r.role), dd);
    }
    wrap.appendChild(dl);

    if (c.fc) {
      wrap.appendChild(el("h3", "", "FC between tests"));
      const f = c.fc;
      if (f.estimate !== null && f.estimate !== undefined) {
        const dl2 = el("dl", "ctrl");
        const dd = el("dd", f.estimate < f.minimum ? "drift" : "", "≈ " + f.estimate + " ppm");
        dd.appendChild(el("small", "", "from ORP · fit on " + f.calibrationPoints + " tests (R² " + f.r2 + ")"));
        dl2.append(el("dt", "", "Estimated FC"), dd);
        if (f.perHour !== null && f.perHour !== undefined) {
          const trend = el("dd", "", (f.perHour >= 0 ? "+" : "−") + Math.abs(f.perHour).toFixed(2) + " ppm/h");
          if (f.hoursToMinimum !== null && f.hoursToMinimum !== undefined) {
            const when = new Date(Date.now() + f.hoursToMinimum * 3600e3);
            trend.appendChild(el("small", "", "reaches " + f.minimum + " around " +
              when.toLocaleString(undefined, { weekday: "short", hour: "numeric", minute: "2-digit" })));
          }
          dl2.append(el("dt", "", "Trend (6 h)"), trend);
        }
        wrap.appendChild(dl2);
      } else {
        wrap.appendChild(el("p", "none", f.note || "Not enough data yet."));
      }
    }

    if (c.comparisons && c.comparisons.length) {
      wrap.appendChild(el("h3", "", "Sensors vs tests"));
      const cmp = el("dl", "ctrl");
      for (const x of c.comparisons) {
        const dd = el("dd", x.drifted ? "drift" : "", deltaText(x, body.tempUnits));
        dd.appendChild(el("small", "", "vs " + (SOURCE_NAMES[x.testSource] || x.testSource) + " " + short(x.at)));
        cmp.append(el("dt", "", ROLE_LABELS[x.role] || x.role), dd);
      }
      wrap.appendChild(cmp);
    }

    for (const f of c.faults || []) wrap.appendChild(el("p", "err", f.name));
    return wrap;
  }

  function additionForm(body) {
    const form = el("form", "manual");

    const amount = input("amount", { type: "number", step: "any", min: "0" });
    const unit = el("select");

    notes.className = "wide";

    form.append(
      el("label", "", "Product"), chemical, el("span"),

      el("label", "", "When"), when,
      el("label", "", "Notes"), notes,
      preview);

    const save = el("button", "", "Log it");
    save.type = "submit";
    const fmsg = el("div", "fmsg", "The preview shows the effect on the current readings before you add it.");
    form.append(save, fmsg);

    const current = () => catalog.chemicals.find((c) => c.name === chemical.value);
    const fillUnits = () => {
      const c = current();
      const units = c.liquid ? catalog.liquidUnits : [...catalog.solidUnits, ...(c.name === "Stabilizer" ? ["cup"] : [])];
      unit.replaceChildren(...units.map((u) => new Option(u, u)));
      unit.value = c.liquid ? "fl oz" : "lb";
      const strength = c.defaultPercent !== null && c.defaultPercent !== undefined;
      for (const node of [percentLabel, percent, percentUnit]) node.style.display = strength ? "" : "none";
      percent.value = strength ? c.defaultPercent : "";
    };

    let timer = null;
    const payload = () => ({
      waterBody: body.name, chemical: chemical.value, amount: Number(amount.value), unit: unit.value,
      percent: percent.value === "" ? null : Number(percent.value),
      at: when.value ? new Date(when.value).toISOString() : null, notes: notes.value || null,
    });
    const updatePreview = () => {
      clearTimeout(timer);
      if (!amount.value || Number(amount.value) <= 0) { preview.textContent = ""; return; }
      timer = setTimeout(async () => {
        const res = await fetch("effects", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload()) });
        const r = await res.json().catch(() => ({}));
        if (!res.ok) { preview.textContent = r.error || ""; return; }
        const parts = r.effects.map((e) => e.label + " " + round(e.from) + " → " + round(e.to));
        if (r.csiBefore !== null && r.csiAfter !== null && r.csiBefore !== r.csiAfter) {
          parts.push("CSI " + signed(r.csiBefore) + " → " + signed(r.csiAfter));
        }
        preview.textContent = parts.length ? parts.join(" · ") : (r.note || "No effect on tracked readings.");
        if (r.note && parts.length) preview.textContent += " (" + r.note + ")";
      }, 300);
    };

    catalogReady.then(() => {
      chemical.replaceChildren(...catalog.chemicals.map((c) => new Option(c.name, c.name)));
      fillUnits();
    });
    chemical.addEventListener("change", () => { fillUnits(); updatePreview(); });
    for (const node of [amount, unit, percent]) node.addEventListener("input", updatePreview);

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (await submit(form, fmsg, save, "additions", "POST", payload())) await refresh(true);
    });
    return form;
  }

  function describeAddition(a) {
    const name = a.chemical || (a.chemicalCode !== null && a.chemicalCode !== undefined
      ? "Pool Math chemical #" + a.chemicalCode : "Chemical");
    const amount = a.amount !== null && a.amount !== undefined
      ? round(a.amount) + " " + (a.unit || (a.unitCode !== null ? "unit #" + a.unitCode : "")) : "";
    return name + (a.percent ? " " + a.percent + "%" : "") + (amount ? ": " + amount : "");
  }

  function describeMaintenance(m) {
    const data = JSON.parse(m.data);
    const parts = Object.entries(data).filter(([k, v]) => v === true && TASKS[k]).map(([k]) => TASKS[k]);
    if (data.pressure !== undefined) parts.push("filter " + data.pressure + " psi");
    if (data.acidRefilledOz !== undefined) parts.push("acid tank +" + data.acidRefilledOz + " fl oz");
    for (const k of ["flowRate", "pumpRuntime", "swgCellPercent"]) {
      if (data[k] !== undefined) parts.push(k + " " + data[k]);
    }
    return parts.join(" · ") || "Maintenance";
  }

  function logSection(body) {
    const wrap = el("div");
    wrap.appendChild(el("p", "none", "Loading…"));
    const q = "?waterBody=" + encodeURIComponent(body.name) + "&limit=30";
    Promise.all([fetch("additions" + q).then((r) => r.json()), fetch("maintenance" + q).then((r) => r.json())])
      .then(([additions, maintenance]) => {
        const entries = [
          ...additions.map((a) => ({ kind: "additions", at: a.at, text: describeAddition(a), item: a })),
          ...maintenance.map((m) => ({ kind: "maintenance", at: m.at, text: describeMaintenance(m), item: m })),
        ].sort((x, y) => new Date(y.at) - new Date(x.at)).slice(0, 40);
        if (!entries.length) { wrap.replaceChildren(el("p", "none", "Nothing logged yet.")); return; }
        const list = el("ul", "history");
        for (const e of entries) {
          const li = el("li");
          li.appendChild(el("span", "vals", e.text));
          li.appendChild(el("span", "meta", new Date(e.at).toLocaleString() + " · " +
            ({ manual: "Manual", poolmath: "Pool Math", controller: "Controller" }[e.item.source] || e.item.source) +
            (e.item.notes ? " · " + e.item.notes : "")));
          if (e.item.source === "manual") {
            const del = el("button", "", "Delete");
            del.type = "button";
            del.addEventListener("click", async () => {
              if (!confirm("Delete this entry?")) return;
              const res = await fetch(e.kind + "/" + encodeURIComponent(e.item.id), { method: "DELETE" });
              if (res.ok) { li.remove(); refresh(true); }

            li.appendChild(del);
          }
          list.appendChild(li);

        wrap.replaceChildren(list);

  const SVG = "http://www.w3.org/2000/svg";
  function svg(tag, attrs) {
    const node = document.createElementNS(SVG, tag);
    for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
    return node;
  }

  // Round tick values: 1, 2 or 5 times a power of ten.
  function ticks(min, max, count) {
    const span = max - min || Math.abs(max) || 1;
    const raw = span / count;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 5, 10].map((m) => m * mag).find((x) => x >= raw);
    const out = [];
    for (let v = Math.ceil(min / step) * step; v <= max + step * 1e-9; v += step) out.push(+v.toFixed(10));
    return out;
  }

  // One series over time. Single series: the title names it, so no legend. Points are tests
  // (markers) or hourly sensor means (line only). The ideal range, when known, is a quiet band.
  function lineChart({ title, points, band, format, markers, from, to }) {
    const wrap = el("div", "chart");
    const values = points.map((p) => p.v);
    const lo = Math.min(...values), hi = Math.max(...values);
    const avg = values.reduce((a, b) => a + b, 0) / values.length;
    const head = el("div", "ctitle");
    head.append(el("span", "", title),
      el("span", "", "low " + format(lo) + " · avg " + format(avg) + " · high " + format(hi) +
        " · " + points.length + (markers ? " tests" : " h")));
    wrap.appendChild(head);

    const W = 340, H = 104, L = 34, R = 8, T = 8, B = 18;
    let yMin = lo, yMax = hi;
    if (band) { yMin = Math.min(yMin, band.min); yMax = Math.max(yMax, band.max); }
    const pad = (yMax - yMin) * 0.12 || Math.abs(yMax) * 0.05 || 1;
    yMin -= pad; yMax += pad;
    const x = (t) => L + (W - L - R) * ((t - from) / (to - from || 1));
    const y = (v) => T + (H - T - B) * (1 - (v - yMin) / (yMax - yMin));

    const chart = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": title + " over time" });
    for (const v of ticks(yMin, yMax, 3)) {
      if (v < yMin || v > yMax) continue;
      chart.append(svg("line", { class: "grid", x1: L, x2: W - R, y1: y(v), y2: y(v) }));
      const label = svg("text", { class: "axis", x: L - 4, y: y(v) + 3, "text-anchor": "end" });
      label.textContent = format(v);
      chart.append(label);
    }
    if (band) {
      const top = y(Math.min(band.max, yMax)), bottom = y(Math.max(band.min, yMin));
      if (bottom > top) chart.append(svg("rect", { class: "band", x: L, y: top, width: W - L - R, height: bottom - top }));
    }
    for (const [t, anchor] of [[from, "start"], [to, "end"]]) {
      const label = svg("text", { class: "axis", x: x(t), y: H - 4, "text-anchor": anchor });
      label.textContent = new Date(t).toLocaleDateString(undefined, to - from > 300 * 864e5
        ? { month: "short", year: "numeric" } : { month: "short", day: "numeric" });
      chart.append(label);
    }
    if (points.length > 1) {
      chart.append(svg("polyline", { class: "line", points: points.map((p) => x(p.t) + "," + y(p.v)).join(" ") }));
    }
    if (markers || points.length === 1) {
      for (const p of points) chart.append(svg("circle", { class: "dot", cx: x(p.t), cy: y(p.v), r: 4 }));
    }

    // Hover: the nearest point by time, with a crosshair and a tooltip.
    const cross = svg("line", { class: "cross", y1: T, y2: H - B, visibility: "hidden" });
    const focus = svg("circle", { class: "dot", r: 5, visibility: "hidden" });
    chart.append(cross, focus);
    const hit = svg("rect", { x: L, y: 0, width: W - L - R, height: H, fill: "transparent" });
    chart.append(hit);
    const tip = el("div", "tip");
    wrap.append(chart, tip);

    hit.addEventListener("pointermove", (event) => {
      const box = chart.getBoundingClientRect();
      const t = from + ((event.clientX - box.left) * (W / box.width) - L) / (W - L - R) * (to - from);
      const p = points.reduce((best, q) => Math.abs(q.t - t) < Math.abs(best.t - t) ? q : best, points[0]);
      const px = x(p.t), py = y(p.v);
      for (const [k, v] of [["x1", px], ["x2", px]]) cross.setAttribute(k, v);
      focus.setAttribute("cx", px); focus.setAttribute("cy", py);
      cross.setAttribute("visibility", "visible"); focus.setAttribute("visibility", "visible");
      tip.textContent = new Date(p.t).toLocaleString(undefined, { month: "short", day: "numeric", year: "numeric",
        hour: "numeric", minute: "2-digit" }) + " · " + format(p.v) + (p.note ? " · " + p.note : "");
      tip.style.display = "block";
      const scale = box.width / W;
      const left = Math.min(Math.max(px * scale - tip.offsetWidth / 2, 0), box.width - tip.offsetWidth);
      tip.style.left = left + "px";
      tip.style.top = (py * scale - 34 + head.offsetHeight) + "px";
    });
    hit.addEventListener("pointerleave", () => {
      cross.setAttribute("visibility", "hidden"); focus.setAttribute("visibility", "hidden");
      tip.style.display = "none";
    });
    return wrap;
  }

  const TREND_FIELDS = [
    ["fc", "FC", (v) => round(v)], ["cc", "CC", (v) => round(v)], ["ph", "pH", (v) => v.toFixed(2)],
    ["ta", "TA", (v) => Math.round(v)], ["cya", "CYA", (v) => Math.round(v)], ["ch", "CH", (v) => Math.round(v)],
    ["salt", "Salt", (v) => Math.round(v)], ["bor", "Borate", (v) => Math.round(v)],
  ];

  function trendsSection(body) {
    const wrap = el("div");
    const ranges = el("div", "ranges");
    const charts = el("div");
    wrap.append(ranges, charts);
    const toF = (c) => (body.tempUnits === 1 ? c : c * 9 / 5 + 32);
    const tempFmt = (v) => v.toFixed(1) + (body.tempUnits === 1 ? " °C" : " °F");
    const band = (key) => {
      const t = (body.balance ? body.balance.targets : []).find((x) => x.key === key);
      return t ? { min: t.min, max: t.max } : null;
    };

    const load = async (days) => {
      for (const b of ranges.children) b.setAttribute("aria-pressed", String(Number(b.dataset.days) === days));
      charts.replaceChildren(el("p", "none", "Loading…"));
      const data = await fetch("trends?waterBody=" + encodeURIComponent(body.name) + "&days=" + days).then((r) => r.json());
      // "All" starts at the first test rather than a century back.
      const first = data.tests.length ? new Date(data.tests[0].takenAt).getTime() : Date.now();
      const from = Math.max(new Date(data.since).getTime(), days >= 36500 ? first - 864e5 : 0), to = Date.now();
      const out = [];

      const series = (key, convert) => data.tests
        .filter((t) => t[key] !== null && t[key] !== undefined)
        .map((t) => ({ t: new Date(t.takenAt).getTime(), v: convert ? convert(t[key]) : t[key],
          note: SOURCE_NAMES[t.source] || t.source }));
      for (const [key, label, format] of TREND_FIELDS) {
        const points = series(key);
        if (points.length) out.push(lineChart({ title: label, points, band: band(key), format, markers: true, from, to }));
      }
      const temps = series("waterTempC", toF);
      if (temps.length) out.push(lineChart({ title: "Water temp", points: temps, format: tempFmt, markers: true, from, to }));
      if (!out.length) out.push(el("p", "none", "No tests in this range."));

      const sensorCharts = [];
      const sensor = (role, label, format, convert) => {
        const s = data.samples[role];
        if (!s || !s.length) return;
        const points = s.map((p) => ({ t: new Date(p.at).getTime(), v: convert ? convert(p.value) : p.value }));
        sensorCharts.push(lineChart({ title: label, points, format, markers: false,
          from: Math.max(from, points[0].t), to }));
      };
      sensor("ph", "pH probe", (v) => v.toFixed(2));
      sensor("orp", "ORP", (v) => Math.round(v) + " mV");
      sensor("waterTemp", "Water temp (sensor)", tempFmt, toF);
      sensor("salt", "Salt cell salt", (v) => Math.round(v));
      sensor("filterPsi", "Filter pressure", (v) => v.toFixed(1) + " psi");
      sensor("pumpWatts", "Pump power", (v) => Math.round(v) + " W");
      if (sensorCharts.length) {
        out.push(el("h3", "", "Controller sensors (hourly)"));
        out.push(...sensorCharts);
      }
      charts.replaceChildren(...out);
    };

    for (const [label, days] of [["30 d", 30], ["90 d", 90], ["1 y", 365], ["All", 36500]]) {
      const b = el("button", "", label);
      b.type = "button";
      b.dataset.days = days;
      b.addEventListener("click", () => load(days));
      ranges.appendChild(b);
    }
    load(90);
    return wrap;
  }

  // The open tab: from the URL, then the last one used, then the first.
  let activeTab = decodeURIComponent(location.hash.slice(1)) || localStorage.getItem("poolsync-tab");

  function warningCount(body) {
    const c = body.controller;
    const issues = c ? (c.issues || []).filter((i) => i.severity === "warning").length + (c.error ? 1 : 0) : 0;
    return issues + (body.reminders || []).filter((r) => r.overdue).length;
  }

  // Minimal Markdown for the analysis: headings, bullets, numbered lists, bold, code. Text is
  // escaped first, so nothing from the response can inject markup.
  function markdown(text) {
    const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const inline = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>");
    const out = [];
    let list = null;
    const close = () => { if (list) { out.push("</" + list + ">"); list = null; } };
    const lines = text.split("\n");
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i].trimEnd();
      let m;
      // A table: a | row | followed by a |---| separator, then rows until the pipes stop.
      if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
        close();
        const cells = (row) => row.trim().replace(/^\||\|$/g, "").split("|").map((c) => inline(c.trim()));
        out.push("<table><thead><tr>" + cells(line).map((c) => "<th>" + c + "</th>").join("") + "</tr></thead><tbody>");
        i += 2;
        for (; i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i]); i++) {
          out.push("<tr>" + cells(lines[i]).map((c) => "<td>" + c + "</td>").join("") + "</tr>");
        }
        i--;
        out.push("</tbody></table>");
      } else if ((m = line.match(/^#{1,6}\s+(.*)$/))) { close(); out.push("<h4>" + inline(m[1]) + "</h4>"); }
      else if ((m = line.match(/^\s*[-*]\s+(.*)$/))) {
        if (list !== "ul") { close(); out.push("<ul>"); list = "ul"; }
        out.push("<li>" + inline(m[1]) + "</li>");
      } else if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) {
        if (list !== "ol") { close(); out.push("<ol>"); list = "ol"; }
        out.push("<li>" + inline(m[1]) + "</li>");
      } else if (!line.trim()) { close(); }
      else { close(); out.push("<p>" + inline(line) + "</p>"); }
    }
    close();
    return out.join("");
  }

  // Analyses survive the 30-second refresh: the latest per water body, and which are running.
  const analyses = {};
  const analysing = new Set();
  const aiOpened = new Set();

  function analysisSection(body) {
    const wrap = el("div");
    const bar = el("div", "ai-bar");
    const button = el("button", "", "Analyze with AI");
    button.type = "button";
    const info = el("span");
    const result = el("div", "analysis");
    bar.append(button, info);
    wrap.append(bar, result);

    const show = () => {
      const a = analyses[body.name];
      button.disabled = analysing.has(body.name) || (a && a.enabled === false);
      if (analysing.has(body.name)) {
        info.textContent = "Analyzing current and recent data… this can take a minute.";
      } else if (a && a.error) {
        info.textContent = a.error;
      } else if (a && a.latest) {
        info.textContent = "Last analyzed " + ago(a.latest.at) + " · " + a.latest.model;
      } else if (a && a.enabled === false) {
        info.textContent = "Add an Anthropic API key (POOLSYNC_Ai__ApiKey) to enable this.";
      } else {
        info.textContent = "Reads this pool's tests, logs and sensors and recommends what to do next.";
      }
      result.innerHTML = a && a.latest ? markdown(a.latest.text) : "";
    };

    if (!analyses[body.name]) {
      fetch("analysis/" + encodeURIComponent(body.name)).then((r) => r.json())
        .then((r) => { analyses[body.name] = r; show(); })
        .catch(() => {});
    }

    button.addEventListener("click", async () => {
      analysing.add(body.name);
      show();
      try {
        const res = await fetch("analysis/" + encodeURIComponent(body.name), { method: "POST" });
        const r = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(r.error || res.status);
        analyses[body.name] = { enabled: true, latest: r };
      } catch (err) {
        analyses[body.name] = { ...(analyses[body.name] || {}), error: "Analysis failed: " + err.message };
      } finally {
        analysing.delete(body.name);
        show();
      }
    });

    show();
    return wrap;
  }

  function card(body) {
    const card = el("div", "card");

    const title = el("h2");
    if (body.shareUrl) {
      // Only linked when Pool Math actually reports a share code, so there are no dead links.
      const a = el("a", "", body.name);
      a.href = body.shareUrl;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      title.appendChild(a);
    } else {
      title.textContent = body.name;
    }
    card.appendChild(title);

    const latest = body.latest;
    card.appendChild(el("div", "when", latest
      ? "Tested " + ago(latest.takenAt) + " · " + new Date(latest.takenAt).toLocaleString()
      : "No LabCOM readings yet"));

    const alerts = alertsBlock(body);
    if (alerts) card.appendChild(alerts);

    const csi = csiLine(body.balance);
    if (csi) card.appendChild(csi);

    card.appendChild(readings(body));
    card.appendChild(balanceSection(body));
    // Open the analysis by default the first time, but respect it being closed after that.
    if (!aiOpened.has(body.name)) { aiOpened.add(body.name); openSections.add(body.name + "|ai"); }
    card.appendChild(section(body, "ai", "AI analysis", () => analysisSection(body)));

    if (body.controller) {
      card.appendChild(section(body, "controller", "Controller", () => controllerSection(body)));
    }
    card.appendChild(section(body, "add", "Add a test", () => testForm(body)));
    card.appendChild(section(body, "chem", "Log a chemical", () => additionForm(body)));
    card.appendChild(section(body, "maint", "Log maintenance", () => maintenanceForm(body)));
    card.appendChild(section(body, "trends", "Trends", () => trendsSection(body)));
    card.appendChild(section(body, "history", "Test history", () => historySection(body)));
    card.appendChild(section(body, "log", "Chemicals & maintenance", () => logSection(body)));
    card.appendChild(section(body, "settings", "Pool settings", () => settingsSection(body)));

    return card;
  }

  async function refresh(force) {
    // Don't rebuild the cards out from under someone typing into one of them.
    const active = document.activeElement;
    if (!force && active && active.closest && active.closest("#bodies form")) return;

    let data;
    try {
      const res = await fetch("status", { cache: "no-store" });
      if (!res.ok) throw new Error("status returned " + res.status);
      data = await res.json();
    } catch (err) {
      document.getElementById("foot").innerHTML =
        '<span class="err">Could not load status: ' + err.message + "</span>";
      return;
    }

    const mode = document.getElementById("mode");
    mode.textContent = data.dryRun ? "Dry run" : "Live";
    mode.className = "badge " + (data.dryRun ? "dry" : "live");
    document.getElementById("interval").textContent = "every " + data.interval;

    const bodies = data.waterBodies || [];
    if (!bodies.some((b) => b.name === activeTab)) activeTab = bodies.length ? bodies[0].name : null;

    const tabs = document.getElementById("tabs");
    tabs.replaceChildren(...bodies.map((b) => {
      const tab = el("button");
      tab.type = "button";
      tab.setAttribute("role", "tab");
      tab.setAttribute("aria-selected", String(b.name === activeTab));
      tab.appendChild(el("span", "", b.name));
      const warnings = warningCount(b);
      if (warnings) {
        const count = el("span", "count", String(warnings));
        count.title = warnings + " warning(s)";
        tab.appendChild(count);
      }
      tab.addEventListener("click", () => {
        activeTab = b.name;
        localStorage.setItem("poolsync-tab", b.name);
        history.replaceState(null, "", "#" + encodeURIComponent(b.name));
        refresh(true);
      });
      return tab;
    }));

    const panel = document.getElementById("bodies");
    const body = bodies.find((b) => b.name === activeTab);
    panel.replaceChildren(...(body ? [card(body)] : []));

    const parts = ["Last sync " + ago(data.lastSuccessAt)];
    if (data.lastError) {
      parts.push('<span class="err">Last error ' + ago(data.lastErrorAt) + ": " +
        data.lastError.replace(/[<>&]/g, "") + "</span>");
    }
    if (data.consecutiveFailures > 0) {
      parts.push(data.consecutiveFailures + " consecutive failure(s)");
    }
    const stored = data.stored || {};
    const tests = Object.entries(stored).filter(([k]) => k.startsWith("tests:")).reduce((n, [, v]) => n + v, 0);
    parts.push(tests + " tests stored");
    if (data.poolMath) {
      parts.push(!data.poolMath.enabled ? "Pool Math off"
        : data.poolMath.writeLogs ? "copying tests to Pool Math" : "not writing to Pool Math");
    }

    const foot = document.getElementById("foot");
    foot.innerHTML = parts.join(" · ");

    if (data.poolMath && data.poolMath.enabled) {
      const importButton = el("button", "", stored["tests:poolmath"] ? "Re-import Pool Math history" : "Import Pool Math history");
      importButton.style.cssText = "margin-left:.75rem;padding:.25rem .7rem;font-size:.8rem";
      importButton.addEventListener("click", async () => {
        importButton.disabled = true;
        importButton.textContent = "Importing…";
        try {
          const res = await fetch("import/poolmath", { method: "POST" });
          const r = await res.json();
          if (!res.ok) throw new Error(r.error || res.status);
          msg.className = "ok";
          msg.textContent = "Imported " + r.tests + " test(s), " + r.additions + " addition(s), " +
            r.maintenance + " maintenance entr(ies); " + r.alreadyImported + " already here.";
        } catch (err) {
          msg.className = "bad";
          msg.textContent = "Import failed: " + err.message;
        }
        refresh(true);
      });
      foot.appendChild(importButton);
    }
  }

  const button = document.getElementById("sync");
  const msg = document.getElementById("msg");

  button.addEventListener("click", async () => {
    button.disabled = true;
    msg.className = "";
    msg.textContent = "Syncing…";

    try {
      const res = await fetch("sync", { method: "POST" });
      const body = await res.json().catch(() => ({}));

      if (res.status === 409) {
        msg.textContent = "A sync is already running.";
      } else if (!res.ok) {
        msg.className = "bad";
        msg.textContent = "Sync failed: " + (body.error || res.status);
      } else {
        msg.className = "ok";
        msg.textContent = body.logsWritten
          ? "Wrote " + body.logsWritten + " test log(s)."
          : "Up to date — nothing new to write.";
      }
    } catch (err) {
      msg.className = "bad";
      msg.textContent = "Sync failed: " + err.message;
    } finally {
      button.disabled = false;
      refresh();
    }
  });

  refresh();
  setInterval(refresh, 30000);
</script>
</body>
</html>
